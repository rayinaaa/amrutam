global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'amrutam-telemedicine-monitor'

scrape_configs:
  - job_name: 'amrutam_api'
    scrape_interval: 5s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['api:3000']
        labels:
          environment: 'production'
          service: 'amrutam-telemedicine-backend'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
