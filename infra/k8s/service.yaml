apiVersion: v1
kind: Service
metadata:
  name: amrutam-telemedicine-svc
  namespace: amrutam-prod
  labels:
    app: amrutam-telemedicine-api
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: amrutam-telemedicine-api
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: amrutam-telemedicine-ingress
  namespace: amrutam-prod
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/limit-connections: "50"
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  tls:
    - hosts:
        - api.amrutam.co.in
      secretName: amrutam-tls-cert
  rules:
    - host: api.amrutam.co.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: amrutam-telemedicine-svc
                port:
                  number: 80
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: amrutam-config
  namespace: amrutam-prod
data:
  NODE_ENV: "production"
  PORT: "3000"
  API_PREFIX: "/api/v1"
  DB_POOL_MIN: "10"
  DB_POOL_MAX: "50"
  CACHE_TTL_SECONDS: "300"
  RATE_LIMIT_WINDOW_MS: "60000"
  RATE_LIMIT_MAX_REQUESTS: "120"
  LOG_LEVEL: "info"
---
apiVersion: v1
kind: Secret
metadata:
  name: amrutam-secrets
  namespace: amrutam-prod
type: Opaque
stringData:
  DATABASE_URL: "postgres://amrutam_admin:StrongProdDbPassword2026!@aurora-pg.cluster-amrutam.ap-south-1.rds.amazonaws.com:5432/amrutam_telemedicine?sslmode=require"
  REDIS_URL: "rediss://:StrongRedisClusterPw!@elasticache-redis.amrutam.ap-south-1.cache.amazonaws.com:6379"
  JWT_SECRET: "amrutam-prod-super-secure-jwt-signing-secret-key-min-64-characters-long"
  JWT_REFRESH_SECRET: "amrutam-prod-super-secure-refresh-token-secret-key-min-64-characters-long"
  ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
